name: Build Android APK All-In-One

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/example/pococooler
        mkdir -p app/src/main/res/layout

        # 1. settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "POCO Cooler Controller"
        include(":app")
        EOF

        # 2. build.gradle.kts (Root)
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.1.4" apply false
            id("org.jetbrains.kotlin.android") version "1.8.10" apply false
        }
        EOF

        # 3. app/build.gradle.kts
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.example.pococooler"
            compileSdk = 33

            defaultConfig {
                applicationId = "com.example.pococooler"
                minSdk = 26
                targetSdk = 33
                versionCode = 1
                versionName = "1.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.10.1")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.9.0")
            implementation("androidx.constraintlayout:constraintlayout:2.1.4")
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
            <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

            <application
                android:allowBackup="true"
                android:label="POCO Cooler"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. layout activity_main.xml
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:gravity="center"
            android:padding="24dp">

            <TextView
                android:id="@+id/tvTemp"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Suhu Baterai: -- °C"
                android:textSize="24sp"
                android:textStyle="bold" />

            <TextView
                android:id="@+id/tvStatus"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Status BLE: Terputus"
                android:layout_marginTop="16dp"
                android:textSize="16sp" />

            <Button
                android:id="@+id/btnConnect"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="24dp"
                android:text="Hubungkan ke ESP32" />
        </LinearLayout>
        EOF

        # 6. MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/example/pococooler/MainActivity.kt
        package com.example.pococooler

        import android.os.Bundle
        import android.os.BatteryManager
        import android.content.Intent
        import android.content.IntentFilter
        import android.widget.Button
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import java.util.Timer
        import java.util.TimerTask

        class MainActivity : AppCompatActivity() {
            private lateinit var tvTemp: TextView
            private lateinit var tvStatus: TextView
            private lateinit var btnConnect: Button
            private var timer: Timer? = null

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                tvTemp = findViewById(R.id.tvTemp)
                tvStatus = findViewById(R.id.tvStatus)
                btnConnect = findViewById(R.id.btnConnect)

                startTempMonitoring()
            }

            private fun startTempMonitoring() {
                timer = Timer()
                timer?.scheduleAtFixedRate(object : TimerTask() {
                    override fun run() {
                        runOnUiThread {
                            val temp = getBatteryTemperature()
                            tvTemp.text = "Suhu Baterai: $temp °C"
                        }
                    }
                }, 0, 2000)
            }

            private fun getBatteryTemperature(): Float {
                val intent = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                val temp = intent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0
                return temp / 10.0f
            }

            override fun onDestroy() {
                super.onDestroy()
                timer?.cancel()
            }
        }
        EOF

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: POCO-Cooler-App
        path: app/build/outputs/apk/debug/app-debug.apk
